<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Outlook Add-in</title>

    <!-- Office JavaScript API -->
    <script
        type="text/javascript"
        src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js">
    </script>

    <!-- Fluent UI -->
    <link
        rel="stylesheet"
        href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"
    />

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">

    <div
        style="
            padding: 20px;
            font-family: Arial, sans-serif;
            max-width: 500px;
        "
    >

        <!-- Heading -->
        <h2
            style="
                margin-top: 0;
                margin-bottom: 8px;
            "
        >
            Process Email
        </h2>

        <p
            style="
                color: #555;
                margin-bottom: 20px;
            "
        >
            Provide additional details for this email.
        </p>


        <!-- ==========================================
             CATEGORY
        =========================================== -->

        <label
            for="category"
            style="
                display: block;
                font-weight: 600;
                margin-bottom: 6px;
            "
        >
            Category
        </label>

        <select
            id="category"
            name="category"
            style="
                width: 100%;
                box-sizing: border-box;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                background-color: white;
                font-size: 14px;
            "
        >
            <option value="">Select Category</option>
            <option value="Tim's To-Dos">Tim's To-Dos</option>
            <option value="Rachel's To-Dos">Rachel's To-Dos</option>
            <option value="Tim — Please Read">Tim — Please Read</option>
            <option value="Waiting on Others">Waiting on Others</option>
        </select>


        <!-- ==========================================
             PRIORITY
        =========================================== -->

        <label
            for="priority"
            style="
                display: block;
                font-weight: 600;
                margin-top: 18px;
                margin-bottom: 6px;
            "
        >
            Priority
        </label>

        <select
            id="priority"
            name="priority"
            style="
                width: 100%;
                box-sizing: border-box;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                background-color: white;
                font-size: 14px;
            "
        >
            <option value="">Select Priority</option>
            <option value="Low">Low</option>
            <option value="Normal">Normal</option>
            <option value="High">High</option>
        </select>


        <!-- ==========================================
             DUE DATE
        =========================================== -->

        <div id="dueDateContainer">

            <label
                for="dueDate"
                style="
                    display: block;
                    font-weight: 600;
                    margin-top: 18px;
                    margin-bottom: 6px;
                "
            >
                Due Date
            </label>

            <input
                type="date"
                id="dueDate"
                name="dueDate"
                style="
                    width: 100%;
                    box-sizing: border-box;
                    padding: 10px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    font-size: 14px;
                "
            />

        </div>


        <!-- ==========================================
             WAITING ON OTHERS FIELDS
        =========================================== -->

        <div id="waitingFields" style="display: none;">

            <!-- Respond From -->

            <label
                for="respondFrom"
                style="
                    display: block;
                    font-weight: 600;
                    margin-top: 18px;
                    margin-bottom: 6px;
                "
            >
                Respond From
            </label>

            <input
                type="email"
                id="respondFrom"
                name="respondFrom"
                placeholder="Enter person's email"
                autocomplete="email"
                style="
                    width: 100%;
                    box-sizing: border-box;
                    padding: 10px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    font-size: 14px;
                "
            />


            <!-- Days -->

            <label
                for="days"
                style="
                    display: block;
                    font-weight: 600;
                    margin-top: 18px;
                    margin-bottom: 6px;
                "
            >
                Days
            </label>

            <input
                type="number"
                id="days"
                name="days"
                min="1"
                max="365"
                placeholder="Enter number of days"
                style="
                    width: 100%;
                    box-sizing: border-box;
                    padding: 10px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    font-size: 14px;
                "
            />

        </div>


        <!-- ==========================================
             ADDITIONAL INSTRUCTIONS
        =========================================== -->

        <label
            for="instructions"
            style="
                display: block;
                font-weight: 600;
                margin-top: 18px;
                margin-bottom: 6px;
            "
        >
            Additional Instructions
        </label>

        <textarea
            id="instructions"
            name="instructions"
            rows="5"
            placeholder="Enter additional instructions..."
            style="
                width: 100%;
                box-sizing: border-box;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-family: Arial, sans-serif;
                font-size: 14px;
                resize: vertical;
            "
        ></textarea>


        <!-- ==========================================
             SEND BUTTON
        =========================================== -->

        <button
            id="sendToFlow"
            style="
                width: 100%;
                margin-top: 24px;
                padding: 11px 18px;
                background-color: #0078d4;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 600;
            "
        >
            Process & Create Task
        </button>


        <!-- ==========================================
             STATUS
        =========================================== -->

        <div
            id="status"
            style="
                margin-top: 15px;
                font-size: 14px;
            "
        ></div>

    </div>

</body>

</html>
