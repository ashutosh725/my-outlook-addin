<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Process Email</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css">
  <link href="taskpane.css" rel="stylesheet" type="text/css">
</head>
<body class="ms-font-m ms-welcome ms-Fabric">
<div style="padding:20px;font-family:Arial,sans-serif;max-width:500px;">
  <h2 style="margin-top:0;margin-bottom:8px;">Process Email</h2>
  <p style="color:#555;margin-bottom:20px;">Provide additional details for this email.</p>

  <label for="category" style="display:block;font-weight:600;margin-bottom:6px;">Category <span style="color:red">*</span></label>
  <select id="category" name="category" required style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;background:white;font-size:14px;">
    <option value="Tim's To-Dos" selected>Tim's To-Dos</option>
    <option value="Rachel's To-Dos">Rachel's To-Dos</option>
    <option value="Tim — Please Read">Tim — Please Read</option>
    <option value="Waiting on Others">Waiting on Others</option>
  </select>

  <label for="priority" style="display:block;font-weight:600;margin-top:18px;margin-bottom:6px;">Priority <span style="color:red">*</span></label>
  <select id="priority" name="priority" required style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;background:white;font-size:14px;">
    <option value="Low">Low</option>
    <option value="Normal" selected>Normal</option>
    <option value="High">High</option>
  </select>

  <div id="dueDateContainer">
    <label for="dueDate" style="display:block;font-weight:600;margin-top:18px;margin-bottom:6px;">Due Date <span style="color:red">*</span></label>
    <input type="date" id="dueDate" name="dueDate" required style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:14px;">
  </div>

  <div id="waitingFields" style="display:none;">
    <label for="respondFrom" style="display:block;font-weight:600;margin-top:18px;margin-bottom:6px;">Respond From <span style="color:red">*</span></label>
    <input type="email" id="respondFrom" name="respondFrom" placeholder="Enter person's email" autocomplete="email" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:14px;">
    <label for="days" style="display:block;font-weight:600;margin-top:18px;margin-bottom:6px;">Days <span style="color:red">*</span></label>
    <input type="number" id="days" name="days" min="1" max="365" placeholder="Enter number of days" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:14px;">
  </div>

  <label for="instructions" style="display:block;font-weight:600;margin-top:18px;margin-bottom:6px;">Additional Instructions <span id="instructionsRequiredStar" style="color:red;display:none">*</span></label>
  <textarea id="instructions" name="instructions" rows="5" placeholder="Enter additional instructions..." style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;font-family:Arial,sans-serif;font-size:14px;resize:vertical;"></textarea>

  <div id="status" role="status" aria-live="polite" style="display:none;margin-top:15px;padding:10px;border-radius:4px;font-size:14px;font-weight:600;"></div>
  <button id="sendToFlow" type="button" style="width:100%;margin-top:24px;padding:11px 18px;background:#0078d4;color:white;border:0;border-radius:4px;cursor:pointer;font-size:14px;font-weight:600;">Process &amp; Create Task</button>
</div>

<script>
(function () {
  const categoryEl = document.getElementById('category');
  const priorityEl = document.getElementById('priority');
  const dueDateContainerEl = document.getElementById('dueDateContainer');
  const dueDateEl = document.getElementById('dueDate');
  const waitingFieldsEl = document.getElementById('waitingFields');
  const respondFromEl = document.getElementById('respondFrom');
  const daysEl = document.getElementById('days');
  const instructionsEl = document.getElementById('instructions');
  const instructionsRequiredStarEl = document.getElementById('instructionsRequiredStar');

  const waitingDefaultInstructions = "This recipient hasn’t responded. Follow up with them.";

  function formatLocalDate(date) {
    return date.getFullYear() + '-' +
      String(date.getMonth() + 1).padStart(2, '0') + '-' +
      String(date.getDate()).padStart(2, '0');
  }

  // Business days exclude Saturday and Sunday; public holidays are not excluded.
  function addBusinessDays(startDate, numberOfDays) {
    const result = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
    let added = 0;

    while (added < numberOfDays) {
      result.setDate(result.getDate() + 1);
      if (result.getDay() !== 0 && result.getDay() !== 6) added++;
    }
    return result;
  }

  function calculateDueDate() {
    const category = categoryEl.value;
    const priority = priorityEl.value;
    const supportedCategories = ["Tim's To-Dos", "Rachel's To-Dos", "Waiting on Others"];

    if (!supportedCategories.includes(category)) {
      dueDateEl.value = '';
      daysEl.value = '';
      return;
    }

    const today = new Date();
    let dueDate;
    let waitingDays = '';

    if (priority === 'Low') {
      dueDate = addBusinessDays(today, 5);
      waitingDays = '5';
    } else if (priority === 'Normal') {
      dueDate = addBusinessDays(today, 3);
      waitingDays = '3';
    } else if (priority === 'High') {
      dueDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      // If today is a weekend, move the due date to the next weekday.
      if (dueDate.getDay() === 6) {
        dueDate.setDate(dueDate.getDate() + 2);
      } else if (dueDate.getDay() === 0) {
        dueDate.setDate(dueDate.getDate() + 1);
      }

      // Waiting on Others: High priority follow-up is in 1 day.
      waitingDays = '1';
    }

    dueDateEl.value = formatLocalDate(dueDate);

    if (category === 'Waiting on Others') {
      daysEl.value = waitingDays;
    } else {
      daysEl.value = '';
    }
  }

  function updateCategoryFields() {
    const category = categoryEl.value;
    const isWaiting = category === 'Waiting on Others';
    const isTaskCategory = category === "Tim's To-Dos" || category === "Rachel's To-Dos";

    dueDateContainerEl.style.display =
      (category === 'Tim — Please Read' || isWaiting) ? 'none' : 'block';

    waitingFieldsEl.style.display = isWaiting ? 'block' : 'none';
    respondFromEl.required = isWaiting;
    daysEl.required = isWaiting;

    instructionsRequiredStarEl.style.display = isTaskCategory ? 'inline' : 'none';
    instructionsEl.required = isTaskCategory;

    if (isWaiting) {
      if (!instructionsEl.value.trim() ||
          instructionsEl.dataset.waitingDefault === 'true') {
        instructionsEl.value = waitingDefaultInstructions;
        instructionsEl.dataset.waitingDefault = 'true';
      }
    } else if (
      instructionsEl.dataset.waitingDefault === 'true' &&
      instructionsEl.value === waitingDefaultInstructions
    ) {
      instructionsEl.value = '';
      delete instructionsEl.dataset.waitingDefault;
    }

    calculateDueDate();
  }

  categoryEl.addEventListener('change', updateCategoryFields);
  priorityEl.addEventListener('change', calculateDueDate);

  instructionsEl.addEventListener('input', function () {
    if (instructionsEl.value !== waitingDefaultInstructions) {
      delete instructionsEl.dataset.waitingDefault;
    }
  });

  // Set initial values and visibility on load.
  updateCategoryFields();
})();
</script>
</body>
</html>
