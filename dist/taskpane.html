<!doctype html><html><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Outlook Add-in</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/><link href="adc1e3a9d9596f3a3df0.css" rel="stylesheet"/><script defer="defer" src="polyfill.js"></script><script defer="defer" src="taskpane.js"></script></head><body class="ms-font-m ms-welcome ms-Fabric"><div style="padding:20px;font-family:Arial,sans-serif;max-width:500px"><h2 style="margin-top:0;margin-bottom:8px">Process Email</h2><p style="color:#555;margin-bottom:20px">Provide additional details for this email.</p><label for="category" style="display:block;font-weight:600;margin-bottom:6px">Category</label> <select id="category" name="category" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;background-color:#fff;font-size:14px"><option value="">Select Category</option><option value="Tim's To-Dos">Tim's To-Dos</option><option value="Rachel's To-Dos">Rachel's To-Dos</option><option value="Tim — Please Read">Tim — Please Read</option><option value="Waiting on Others">Waiting on Others</option></select> <label for="priority" style="display:block;font-weight:600;margin-top:18px;margin-bottom:6px">Priority</label> <select id="priority" name="priority" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;background-color:#fff;font-size:14px"><option value="">Select Priority</option><option value="Low">Low</option><option value="Normal">Normal</option><option value="High">High</option></select><div id="dueDateContainer"><label for="dueDate" style="display:block;font-weight:600;margin-top:18px;margin-bottom:6px">Due Date</label> <input type="date" id="dueDate" name="dueDate" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:14px"/></div><div id="waitingFields" style="display:none"><label for="respondFrom" style="display:block;font-weight:600;margin-top:18px;margin-bottom:6px">Respond From</label> <input type="email" id="respondFrom" name="respondFrom" placeholder="Enter person's email" autocomplete="email" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:14px"/> <label for="days" style="display:block;font-weight:600;margin-top:18px;margin-bottom:6px">Days</label> <input type="number" id="days" name="days" min="1" max="365" placeholder="Enter number of days" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:14px"/></div><label for="instructions" style="display:block;font-weight:600;margin-top:18px;margin-bottom:6px">Additional Instructions</label> <textarea id="instructions" name="instructions" rows="5" placeholder="Enter additional instructions..." style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:4px;font-family:Arial,sans-serif;font-size:14px;resize:vertical"></textarea> <button id="sendToFlow" style="width:100%;margin-top:24px;padding:11px 18px;background-color:#0078d4;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;font-weight:600">Process & Create Task</button><div id="status" style="margin-top:15px;font-size:14px"></div></div></body></html>
